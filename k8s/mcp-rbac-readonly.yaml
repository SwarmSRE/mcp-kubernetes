# swarmsre-mcp-readonly.yaml
# Readonly RBAC for the MCP server — Discovery & Investigation (Phase 1)
---
apiVersion: v1
kind: Namespace
metadata:
  name: swarmsre-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: swarmsre-mcp-readonly
  namespace: swarmsre-system
  labels:
    app.kubernetes.io/name: swarmsre
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: swarmsre
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: swarmsre-mcp-readonly
  labels:
    app.kubernetes.io/name: swarmsre
rules:
  # Core resources — read-only
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - events
      - configmaps
      - namespaces
      - nodes
      - persistentvolumeclaims
      - replicationcontrollers
    verbs: ["get", "list", "watch"]
  # Apps resources — read-only
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]
  # Batch resources — read-only
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  # Networking — read-only
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch"]
  # Metrics — read-only
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - pods
      - nodes
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: swarmsre-mcp-readonly
  labels:
    app.kubernetes.io/name: swarmsre
subjects:
  - kind: ServiceAccount
    name: swarmsre-mcp-readonly
    namespace: swarmsre-system
roleRef:
  kind: ClusterRole
  name: swarmsre-mcp-readonly
  apiGroup: rbac.authorization.k8s.io
